name: Build unsigned iOS client
on:
  workflow_dispatch:
  push:
    branches: ['ios-client']
    paths: ['ios/**', '.github/workflows/ios-unsigned.yml']
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate unsigned arm64 device app
        run: bash ios/scripts/build-unsigned.sh
      - name: Build simulator app and capture login screen
        working-directory: ios
        run: |
          xcodebuild -project Starpost.xcodeproj -scheme Starpost -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build > build/xcode-simulator.log 2>&1 || { tail -n 100 build/xcode-simulator.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Simulator/Build/Products/Debug-iphonesimulator/Starpost.app
          xcrun simctl launch "$DEVICE" io.starpost.ios
          sleep 5
          xcrun simctl io "$DEVICE" screenshot build/distribution/login-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE" screenshot build/distribution/login-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starpost-ios-unsigned
          path: |
            ios/build/distribution/
            ios/build/xcode-*.log
          if-no-files-found: error
          retention-days: 14
